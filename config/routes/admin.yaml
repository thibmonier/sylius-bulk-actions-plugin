tmonier_bulk_actions_admin_ship_with_tracking_codes:
    path: /bulk-actions/shipments/ship-with-tracking-codes
    methods: [GET, POST]
    defaults:
        _controller: tmonier_bulk_actions.controller.admin::shipWithTrackingCodesAction

tmonier_bulk_actions_admin_prepare:
    path: /bulk-actions/{code}
    methods: [POST]
    requirements:
        code: '[a-z0-9_]+'
    defaults:
        _controller: tmonier_bulk_actions.controller.admin::prepareAction

tmonier_bulk_actions_admin_execute:
    path: /bulk-actions/{code}/execute
    methods: [POST]
    requirements:
        code: '[a-z0-9_]+'
    defaults:
        _controller: tmonier_bulk_actions.controller.admin::executeAction
